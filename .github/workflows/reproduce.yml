name: Reconstruct recorded main tables
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  replay:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements-replay.txt
      - if: runner.os == 'Windows'
        run: python verify_submission.py --work-dir C:/r2d2_tmp --report verification_ci.json
      - if: runner.os != 'Windows'
        run: python verify_submission.py --report verification_ci.json
